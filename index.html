<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HVAC Forms Template Set</title>
    <!-- CSS cascade in strict dependency order -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/print.css">
</head>

<body>
    <header class="toolbar noprint">
        <div class="toolbar-inner">
            <div class="toolbar-bar">
                <div class="toolbar-left">
                    <div class="toolbar-brand">
                        <span class="toolbar-badge">HVAC</span>
                        <span class="toolbar-title">Form Suite</span>
                    </div>
                    <select id="co" class="form-select" style="width:auto" aria-label="Company theme"></select>
                    <select id="viewMode" class="form-select" style="width:auto" aria-label="View format">
                        <option value="link">Link View (Full Color)</option>
                        <option value="print">Print / PDF View</option>
                    </select>
                    <select id="mode" class="form-select" style="width:auto" aria-label="Preview mode">
                        <option value="sample">Preview with sample data</option>
                        <option value="ph">Show placeholders only</option>
                    </select>
                    <label class="legend"><input type="checkbox" id="hl" checked> <i></i> Database field <span
                            class="text-muted">(unmarked = static)</span></label>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-outline btn-sm" id="cp">Copy sample JSON</button>
                    <button class="btn btn-outline btn-sm" id="pOne" title="Lưu ý khi in: Trong hộp thoại in (Ctrl+P) chọn Scale: 100% (Default)">Print this form</button>
                    <button class="btn btn-primary btn-sm" id="pAll" title="Lưu ý khi in: Trong hộp thoại in (Ctrl+P) chọn Scale: 100% (Default)">Print all 10</button>
                </div>
            </div>
            <div class="nav-tabs" id="tabs" role="tablist"></div>
        </div>
    </header>
    <main class="page-wrapper" id="docs"></main>

    <!-- JavaScript dependencies in strict execution order -->
    <script defer src="js/config.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/templates.js"></script>
    <script defer src="js/render.js"></script>
    <script defer src="js/events.js"></script>
    <script defer src="js/main.js"></script>
</body>

</html>
