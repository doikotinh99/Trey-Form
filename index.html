<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HVAC Forms Template Set</title>
    <style>
        /* ===== Bootstrap-5-style utilities, pure CSS (no framework). Theme = CSS variables on :root ===== */
        :root {
            --brand: #0b2545;
            --accent: #c8102e;
            --bs-border: #dee2e6;
            --bs-muted: #64748b;
            --bs-body: #1e293b;
            --bs-light: #f8fafc;
            --r: .3rem;
            --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 400 14.5px/1.45 var(--font);
            color: var(--bs-body);
            background: #e9ecef;
        }

        .container {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 0 .75rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -.4rem;
        }

        .row>* {
            padding: 0 .4rem;
            margin-bottom: .6rem;
        }

        .col {
            flex: 1 0 0;
        }

        .col-4 {
            width: 33.333%;
        }

        .col-6 {
            width: 50%;
        }

        .col-12 {
            width: 100%;
        }

        .d-flex {
            display: flex;
        }

        .justify-between {
            justify-content: space-between;
        }

        .align-center {
            align-items: center;
        }

        .gap-2 {
            gap: .5rem;
        }

        .mb-2 {
            margin-bottom: .35rem;
        }

        .mb-3 {
            margin-bottom: .6rem;
        }

        .mt-3 {
            margin-top: .6rem;
        }

        .text-muted {
            color: var(--bs-muted);
        }

        .text-end {
            text-align: right;
        }

        .small {
            font-size: .84rem;
        }

        .fw-bold {
            font-weight: 700;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            margin: 0 0 .4rem;
            font-weight: 700;
            line-height: 1.25;
            color: var(--brand);
        }

        h1 {
            font-size: 1.85rem;
        }

        h2 {
            font-size: 1.45rem;
        }

        h5 {
            font-size: 1.12rem;
            margin-top: .65rem;
            margin-bottom: .35rem;
        }

        .btn {
            display: inline-block;
            padding: .35rem .75rem;
            font: inherit;
            font-size: .85rem;
            line-height: 1.45;
            border: 1px solid transparent;
            border-radius: var(--r);
            background: none;
            cursor: pointer;
            transition: filter .15s;
        }

        .btn:hover {
            filter: brightness(.92);
        }

        .btn:focus-visible,
        .form-control:focus-visible,
        .form-select:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--brand) 35%, transparent);
            outline-offset: 1px;
        }

        .btn-primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .btn-outline {
            border-color: var(--bs-border);
            color: var(--bs-body);
            background: #fff;
        }

        .btn-sm {
            padding: .25rem .55rem;
            font-size: .82rem;
        }

        .form-control,
        .form-select {
            display: block;
            width: 100%;
            padding: .35rem .7rem;
            font: inherit;
            font-size: .85rem;
            border: 1px solid #ced4da;
            border-radius: var(--r);
            background: #fff;
        }

        .form-label {
            display: block;
            margin-bottom: 2px;
            font-size: .78rem;
            font-weight: 600;
            color: var(--bs-muted);
        }

        .card {
            border: 1px solid var(--bs-border);
            border-radius: var(--r);
            background: #fff;
            height: 100%;
        }

        .card-header {
            padding: .45rem .8rem;
            background: rgba(0, 0, 0, .02);
            border-bottom: 1px solid var(--bs-border);
            font-weight: 600;
            font-size: .86rem;
            border-radius: var(--r) var(--r) 0 0;
        }

        .card-body {
            padding: .65rem .8rem;
            font-size: .88rem;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem;
        }

        .table th,
        .table td {
            padding: .45rem .65rem;
            border: 1px solid var(--bs-border);
            vertical-align: top;
        }

        .table thead th {
            background: var(--brand);
            color: #fff;
            font-weight: 600;
            text-align: left;
        }

        .badge {
            display: inline-block;
            padding: .28em .6em;
            font-size: .74em;
            font-weight: 700;
            border-radius: var(--r);
            background: var(--accent);
            color: #fff;
        }

        .alert {
            padding: .5rem .8rem;
            border: 1px solid color-mix(in srgb, var(--brand) 30%, #fff);
            border-radius: var(--r);
            background: color-mix(in srgb, var(--brand) 7%, #fff);
            font-size: .84rem;
            line-height: 1.4;
        }

        .nav-tabs {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: .35rem;
            border-bottom: 1px solid var(--bs-border);
            scrollbar-width: thin;
        }

        .nav-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .nav-tabs::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .nav-tabs button {
            padding: .55rem .95rem;
            font: inherit;
            font-size: .88rem;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: var(--r) var(--r) 0 0;
            background: none;
            cursor: pointer;
            color: #475569;
            transition: all .15s ease;
            flex: none;
        }

        .nav-tabs button:hover {
            color: var(--brand);
            background: rgba(0, 0, 0, .02);
        }

        .nav-tabs button.active {
            background: #fff;
            border-color: var(--bs-border) var(--bs-border) #fff;
            border-bottom: 2px solid var(--accent);
            color: var(--brand);
            font-weight: 600;
            margin-bottom: -1px;
        }

        .form-check {
            display: flex;
            gap: .45rem;
            align-items: flex-start;
            margin-bottom: .35rem;
            font-size: .86rem;
        }

        /* ===== app chrome (fullwidth, hidden on print) ===== */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, .97);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--bs-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
            padding: .6rem 0 0 0;
        }

        .toolbar-inner {
            width: 100%;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .toolbar-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: .55rem;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }

        .toolbar-brand {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-right: .4rem;
        }

        .toolbar-badge {
            background: var(--brand);
            color: #fff;
            font-size: .74rem;
            font-weight: 700;
            padding: .18rem .42rem;
            border-radius: 4px;
            letter-spacing: .5px;
        }

        .toolbar-title {
            font-weight: 600;
            font-size: .95rem;
            color: #1e293b;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: .45rem;
            flex-wrap: wrap;
        }

        /* ===== document sheet (A4 Standard Width: 210mm, Natural Flow Height) ===== */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        .sheet {
            background: #fff;
            width: 210mm;
            min-height: 297mm;
            height: auto;
            max-width: calc(100vw - 1.5rem);
            margin: 1.25rem auto 3rem;
            padding: 14mm 16mm;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            display: none;
            position: relative;
        }

        .sheet.show {
            display: block;
        }

        .doc-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            padding-bottom: .6rem;
            border-bottom: 3px solid var(--brand);
            margin-bottom: .75rem;
        }

        .brand-name {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--brand);
            line-height: 1.1;
        }

        .brand-tag {
            color: var(--bs-muted);
            font-size: .88rem;
            margin-top: 3px;
        }

        .doc-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--brand);
            margin: 0 0 .55rem;
        }

        .ed {
            outline: none;
            border-bottom: 1px dashed #adb5bd;
            min-width: 2ch;
            display: inline-block;
            min-height: 1.35em;
        }

        .ed:focus {
            background: #fff8dc;
        }

        div.ed,
        td.ed {
            display: block;
        }

        td .ed {
            display: block;
            border: 0;
        }

        .photo {
            position: relative;
            min-height: 165px;
            height: 165px;
            border: 1px dashed #adb5bd;
            border-radius: var(--r);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bs-light);
            overflow: hidden;
            color: var(--bs-muted);
            font-size: .88rem;
            text-align: center;
        }

        .photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo button {
            position: absolute;
            bottom: .35rem;
            right: .35rem;
            z-index: 2;
        }

        .sig {
            border-bottom: 2px solid #000;
            height: 2.6rem;
            margin-top: .5rem;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding-bottom: 2px;
        }

        .sig img {
            position: absolute;
            left: 0;
            bottom: 2px;
            max-height: 2.5rem;
            width: auto;
            height: auto;
        }

        .doc-foot {
            margin-top: .75rem;
            padding-top: .45rem;
            border-top: 1px solid var(--bs-border);
            font-size: .8rem;
            color: var(--bs-muted);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .totals {
            margin-left: auto;
            width: min(18rem, 100%);
        }

        .totals div {
            display: flex;
            justify-content: space-between;
            padding: .25rem 0;
            border-bottom: 1px solid var(--bs-border);
            font-size: .86rem;
        }

        .totals .grand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--brand);
            border-bottom: 2px solid var(--accent);
        }

        @media(max-width:640px) {
            .col-4,
            .col-6 {
                width: 100%;
            }

            .sheet {
                padding: .85rem;
            }

            .specs {
                grid-template-columns: 1fr !important;
                gap: .25rem !important;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 14mm;
            }

            html,
            body {
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                font-size: 14px !important;
                line-height: 1.45 !important;
                color: #0f172a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .toolbar,
            .noprint,
            .btn,
            .photo button {
                display: none !important;
            }

            .page-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                width: 100% !important;
            }

            .sheet,
            .sheet.show {
                display: block !important;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                height: auto !important;
                overflow: visible !important;
                page-break-after: always;
                break-after: page;
            }

            body:not(.print-all) .sheet:not(.show) {
                display: none !important;
            }

            .sheet + .sheet {
                page-break-before: always !important;
                break-before: page !important;
            }

            .ed {
                border-bottom: 1px solid transparent;
            }

            .table thead th,
            .doc-head,
            .badge,
            .totals .grand,
            .total-card,
            .box.on::after {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Natural Pagination - Prevent empty blank voids & prevent orphaned headings */
            h1,
            h2,
            h3,
            h4,
            h5 {
                break-after: avoid !important;
                page-break-after: avoid !important;
            }

            .doc-head,
            .doc-foot,
            .eqrow,
            .total-card,
            .sig,
            .table tr,
            .photo,
            .alert {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .eq {
                break-inside: auto !important;
                page-break-inside: auto !important;
                margin-bottom: .6rem !important;
            }

            .eq-details {
                border-top: 1px solid #cbd5e1 !important;
                padding: .4rem .8rem .5rem !important;
                margin: 0 !important;
                width: 100% !important;
                box-sizing: border-box !important;
                background: none !important;
            }

            details,
            details[open],
            details > :not(summary) {
                display: block !important;
            }

            details summary {
                display: block !important;
                list-style: none !important;
            }

            details summary::-webkit-details-marker,
            details summary::marker {
                display: none !important;
            }

            .specs {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 2.5px 24px !important;
                width: 100% !important;
            }

            .specs .sp {
                display: flex !important;
                justify-content: space-between !important;
                border-bottom: 1px solid #eef2f6 !important;
                font-size: 13px !important;
            }
        }

        .bind {
            display: inline;
        }

        .ph .bind {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .82em;
            color: #6c757d;
        }

        .hl .bind,
        .hl [data-bind-src],
        .hl .box {
            background: #fff3cd;
            outline: 1px dashed #d39e00;
            outline-offset: 1px;
            border-radius: 3px;
        }

        .legend {
            display: flex;
            gap: .75rem;
            align-items: center;
            font-size: .82rem;
        }

        .legend i {
            display: inline-block;
            width: .95rem;
            height: .75rem;
            border: 1px dashed #d39e00;
            background: #fff3cd;
            border-radius: 3px;
            vertical-align: -1px;
        }

        .img,
        .photo,
        .sig {
            position: relative;
        }

        .img {
            width: 160px;
            height: 125px;
            min-height: 125px;
            max-height: 125px;
            flex: 0 0 160px;
            align-self: flex-start;
            border: 1px dashed #adb5bd;
            border-radius: var(--r);
            background: var(--bs-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bs-muted);
            font-size: .85rem;
            overflow: hidden;
        }

        .img img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #f8fafc;
        }

        .has span {
            display: none;
        }

        .eqlist {
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .eq {
            height: auto;
        }

        .eqrow {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: .75rem .9rem;
        }

        .eqbody {
            flex: 1;
            min-width: 0;
        }

        .eqbody h5 {
            font-size: 1.12rem;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .kspecs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin: 4px 0;
        }

        .kspecs > div {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            padding: 2px 7px;
            font-size: .82rem;
            font-weight: 600;
        }

        .kspecs .form-label {
            margin: 0;
            font-size: .7rem;
        }

        .ok {
            color: #198754;
        }

        .eq-details {
            border-top: 1px solid var(--bs-border);
            padding: .5rem .9rem .65rem;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
            background: #fafbfc;
            border-radius: 0 0 var(--r) var(--r);
        }

        .eq-details summary {
            cursor: pointer;
            color: var(--brand);
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 5px;
            user-select: none;
            outline: none;
            transition: color .15s ease;
        }

        .eq-details summary:hover {
            color: var(--accent);
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px 24px;
            width: 100%;
        }

        .specs .sp {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            padding: 2.5px 0;
            border-bottom: 1px solid #eef2f6;
            font-size: .84rem;
        }

        .total-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .65rem 1.1rem;
            background: var(--brand);
            color: #fff;
            border-radius: var(--r);
            border-bottom: 3px solid var(--accent);
            font-size: .95rem;
        }

        .big {
            font-size: 1.85rem;
            font-weight: 800;
        }

        .big2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--brand);
        }

        .big2 small {
            font-size: .72rem;
            font-weight: 400;
            color: var(--bs-muted);
        }

        .fin {
            display: contents;
        }

        .box {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--bs-body);
            border-radius: 3px;
            flex: none;
            margin-top: .12rem;
            position: relative;
        }

        .box.on::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 0;
            width: 4px;
            height: 9px;
            border: solid var(--bs-body);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .sheet .doc-title {
            margin-bottom: .5rem;
        }

        .fin > * {
            margin-bottom: .5rem;
        }
</style>
</head>

<body>
    <header class="toolbar noprint">
        <div class="toolbar-inner">
            <div class="toolbar-bar">
                <div class="toolbar-left">
                    <div class="toolbar-brand">
                        <span class="toolbar-badge">HVAC</span>
                        <span class="toolbar-title">Form Suite</span>
                    </div>
                    <select id="co" class="form-select" style="width:auto" aria-label="Company theme"></select>
                    <select id="mode" class="form-select" style="width:auto" aria-label="Preview mode">
                        <option value="sample">Preview with sample data</option>
                        <option value="ph">Show placeholders only</option>
                    </select>
                    <label class="legend"><input type="checkbox" id="hl" checked> <i></i> Database field <span
                            class="text-muted">(unmarked = static)</span></label>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-outline btn-sm" id="cp">Copy sample JSON</button>
                    <button class="btn btn-outline btn-sm" id="pOne" title="Lưu ý khi in: Trong hộp thoại in (Ctrl+P) chọn Scale: 100% (Default)">Print this form</button>
                    <button class="btn btn-primary btn-sm" id="pAll" title="Lưu ý khi in: Trong hộp thoại in (Ctrl+P) chọn Scale: 100% (Default)">Print all 10</button>
                </div>
            </div>
            <div class="nav-tabs" id="tabs" role="tablist"></div>
        </div>
    </header>
    <main class="page-wrapper" id="docs"></main>
    <script>
        /* ============================================================================
         HVAC FORMS — DATA-DRIVEN TEMPLATE SET (pure CSS, Bootstrap-5 look)
         Nothing is typed into these forms. Every database value is a marked field:
           data-bind="path"        text from data   (inside data-repeat, path is relative to the row)
           data-bind-src="path"    image URL from data (photos, signatures, product images)
           data-check="path" data-value="v"   checkbox ticked when data[path] equals / includes v
           data-repeat="array"     <template> inside is cloned once per array item
         Everything without these attributes is static layout/wording.
         API:  HVAC.render(sectionElement, data)  ·  HVAC.fields(formKey)  ·  HVAC.forms
        ============================================================================ */
        const THEMES = {
            jerrys: { label: "Jerry's Heating & Cooling", brand: "#0b2545", accent: "#c8102e", font: 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif' },
            sample: { label: "Sample Company HVAC", brand: "#14532d", accent: "#d97706", font: 'Georgia,"Times New Roman",serif' }
        };
        const FORMS = [["estimate", "Estimate"], ["install-agreement", "Installation Agreement"], ["install-receipt", "Installation Receipt"], ["inspection", "Inspection Report"], ["approval", "Estimate Approval"], ["service-receipt", "Service Receipt"], ["buyer-seller", "Buyer / Seller Report"], ["right-to-repair", "Right to Repair"], ["decline", "Decline to Service"], ["warranty", "Warranties & Guidelines"]];
        const B = (p, c = "") => `<span class="bind ${c}" data-bind="${p}">{{${p}}}</span>`;
        const IMG = (p, c = "img", t = "Image") => `<div class="${c}" data-bind-src="${p}"><span>${t}</span></div>`;
