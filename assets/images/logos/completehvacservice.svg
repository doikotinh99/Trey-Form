<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="cmp-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cmp-cool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <circle cx="30" cy="30" r="27" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Top Arc: Heating (Red/Orange) with arrow -->
  <path d="M14 30 A16 16 0 0 1 46 30" fill="none" stroke="url(#cmp-warm)" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="44,24 50,31 43,33" fill="#ea580c"/>
  <!-- Bottom Arc: Cooling (Blue/Cyan) with arrow -->
  <path d="M46 30 A16 16 0 0 1 14 30" fill="none" stroke="url(#cmp-cool)" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="16,36 10,29 17,27" fill="#0284c7"/>
  <!-- Center Comfort Sun/Snow Symbol -->
  <circle cx="30" cy="30" r="5" fill="#f59e0b"/>
  <line x1="30" y1="21" x2="30" y2="39" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="21" y1="30" x2="39" y2="30" stroke="#ffffff" stroke-width="1.5"/>
</svg>